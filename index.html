<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SignUp Form</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <section class="image-sidebar">
        <div class="logo-container">
          <img src="./images/odin-lined.png" alt="" class="logo-img" />
          <h1 class="logo">ODIN</h1>
        </div>
        <p class="photo-credit">
          Photo by <a href="#">Photographer</a> on Unsplash.
        </p>
      </section>
      <section class="form-section">
        <div class="form-header">
          <p>
            This is not a real online service! You know you something like this
            in your life to help you realize your deepest dreams. Sign up
            <em>now</em> to get started.
          </p>
          <p>
            You <em><b>know</b></em> you want to.
          </p>
        </div>
        <form action="#" method="post" class="signup-form">
          <fieldset>
            <legend>Let's do this.</legend>
            <div class="form-row">
              <div class="input-group">
                <label for="first-name">FIRST NAME</label>
                <input type="text" name="first-name" id="first-name" required />
              </div>
              <div class="input-group">
                <label for="last-name">LAST NAME</label>
                <input type="text" name="last-name" id="last-name" required />
              </div>
            </div>
            <div class="form-row">
              <div class="input-group">
                <label for="email">EMAIL</label>
                <input type="email" name="email" id="email" required />
              </div>
              <div class="input-group">
                <label for="phone">PHONE NUMBER</label>
                <input type="tel" name="phone" id="phone" />
              </div>
            </div>
            <div class="form-row">
              <div class="input-group">
                <label for="password">PASSWORD</label>
                <input
                  type="password"
                  minlength="8"
                  name="password"
                  id="password"
                  required
                />
              </div>
              <div class="input-group">
                <label for="confirm-password">CONFIRM PASSWORD</label>
                <input
                  type="password"
                  name="confirm-password"
                  id="confirm-password"
                  minlength="8"
                  required
                />
              </div>
            </div>
          </fieldset>
          <div class="form-actions">
            <button type="submit" class="submit-btn">Create Account</button>
            <p class="login-prompt">
              Already have an account? <a href="#">Log in</a>
            </p>
          </div>
        </form>
      </section>
    </main>
  </body>
</html>
